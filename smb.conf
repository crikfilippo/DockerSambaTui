[global]
   workgroup = WORKGROUP
   server role = standalone server
   security = user
   passdb backend = tdbsam
   map to guest = never
   server min protocol = SMB2
   smb ports = 445

   # Log su stdout (docker logs): connessioni, accessi, errori.
   log level = 3

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # I nuovi file e le nuove cartelle ereditano permessi e owner dalla
   # cartella che li contiene (valido per tutte le share).
   inherit permissions = yes
   inherit owner = yes
   # Senza questo i file nuovi ricevono il bit di esecuzione per l'owner.
   map archive = no

   # File di sistema inutili creati da Windows e macOS. NON vetare i lock di
   # Office (~$*): servono per l'avviso "file in uso".
   veto files = /Thumbs.db/desktop.ini/.DS_Store/._*/
   delete veto files = yes
