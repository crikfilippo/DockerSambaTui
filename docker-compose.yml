services:
  samba:
    build: .
    image: ghcr.io/crikfilippo/docker-samba-tui:latest
    container_name: samba
    hostname: samba
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "445:445"
    volumes:
      - ./config:/config
      - ./shares:/shares
    healthcheck:
      test: ["CMD", "pgrep", "-x", "smbd"]
      interval: 30s
      timeout: 5s
      retries: 3
